<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile Currency & Weather Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Courier New", Courier, monospace;
        background-color: #f9f9f9;
        display: flex;
        justify-content: center;
        padding: 20px;
        min-height: 100vh;
      }

      .mobile-container {
        width: 100%;
        max-width: 375px;
        background-color: #fff;
        border: 2px solid #000;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* Header Section - Centered */
      .header {
        padding: 15px;
        border-bottom: 2px solid #000;
        text-align: center;
      }

      .header-title {
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 5px; /* Small space between title and toggle */
      }

      .header-toggle {
        font-size: 12px;
        font-weight: normal;
      }

      /* Card Container - Each card is a distinct box */
      .card {
        border: 2px solid #000;
        margin: 15px;
        padding: 15px;
        background-color: #fff;
      }

      .card-title {
        text-align: center;
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 15px;
        border-bottom: 2px solid #000;
        padding-bottom: 5px;
      }

      .form-group {
        margin-bottom: 12px;
      }

      .label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        font-size: 14px;
      }

      .input-wrapper {
        border: 1px solid #000;
        padding: 8px;
        background-color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .input-wrapper input {
        border: none;
        font-family: "Courier New", monospace;
        font-size: 14px;
        width: 100%;
        outline: none;
        background: transparent;
      }

      .input-wrapper select {
        border: none;
        font-family: "Courier New", monospace;
        font-size: 14px;
        width: 100%;
        outline: none;
        appearance: none;
        text-align: right;
        font-weight: bold;
        background: transparent;
      }

      .swap-icon {
        text-align: center;
        font-size: 14px;
        margin: 10px 0;
        cursor: pointer;
      }

      .button {
        background-color: #000;
        color: #fff;
        border: 2px solid #000;
        padding: 10px;
        width: 100%;
        font-family: "Courier New", monospace;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        text-align: center;
        margin-top: 5px;
      }

      .result {
        margin-top: 15px;
        padding: 10px;
        border: 1px solid #000;
        font-weight: bold;
        font-size: 14px;
        background-color: #fff;
      }

      .weather-info {
        margin-top: 15px;
        border-top: 2px solid #000;
        padding-top: 10px;
      }

      .weather-city {
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 10px;
        text-align: center;
      }

      .weather-detail {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 14px;
        border-bottom: 1px solid #000;
        padding-bottom: 3px;
      }

      .weather-detail:last-child {
        border-bottom: none;
      }

      .weather-label {
        font-weight: bold;
      }

      .weather-value {
        margin-left: 10px;
      }
    </style>
  </head>
  <body>
    <div class="mobile-container">
      <!-- Header Section - Centered -->
      <div class="header">
        <div class="header-title">[Logo] Dashboard</div>
        <div class="header-toggle">[Dark Mode v]</div>
      </div>

      <!-- Currency Converter Card (Separated Box) -->
      <div class="card">
        <div class="card-title">Currency Converter</div>

        <div class="form-group">
          <div class="label">Amount:</div>
          <div class="input-wrapper">
            <input type="number" value="1.00" step="0.01" />
          </div>
        </div>

        <div class="form-group">
          <div class="label">From:</div>
          <div class="input-wrapper">
            <input type="text" value="GBP" readonly />
            <span>▼</span>
          </div>
        </div>

        <div class="swap-icon">[ Swap Icon ]</div>

        <div class="form-group">
          <div class="label">To:</div>
          <div class="input-wrapper">
            <input type="text" value="USD" readonly />
            <span>▼</span>
          </div>
        </div>

        <div class="button">[ Convert Currency ]</div>

        <div class="result">Result: 1 GBP = 1.35 USD</div>
      </div>

      <!-- Weather Card (Separated Box) -->
      <div class="card" style="margin-bottom: 15px">
        <div class="card-title">Weather</div>

        <div class="form-group">
          <div class="label">City:</div>
          <div class="input-wrapper">
            <input type="text" value="London" />
          </div>
        </div>

        <div class="button">[ Get Weather ]</div>

        <div class="weather-info">
          <div class="weather-city">London</div>

          <div class="weather-detail">
            <span class="weather-label">Temp:</span>
            <span class="weather-value">24.81°C</span>
          </div>

          <div class="weather-detail">
            <span class="weather-label">Clear Sky</span>
            <span class="weather-value">Hum: 58%</span>
          </div>

          <div class="weather-detail">
            <span class="weather-label">Wind:</span>
            <span class="weather-value">4.12 m/s</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
